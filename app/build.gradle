plugins {
    id 'com.android.application'
}

android {
    namespace 'com.anuj.snake2d'
    compileSdk 34

    defaultConfig {
        applicationId 'com.anuj.snake2d'
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName '1.0.0.6'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
